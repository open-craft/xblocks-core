name: JavaScript Tests

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"

jobs:
  javascript-tests:
    name: Run JavaScript Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Latest Firefox
        run: |
          sudo apt-get purge -y firefox
          LATEST_VERSION=$(curl -s https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r '.LATEST_FIREFOX_VERSION')
          echo "Latest Firefox version is $LATEST_VERSION"
          wget "https://ftp.mozilla.org/pub/firefox/releases/${LATEST_VERSION}/linux-x86_64/en-US/firefox-${LATEST_VERSION}.tar.xz" -O firefox.tar.xz
          tar -xJf firefox.tar.xz
          sudo mv firefox /opt/firefox
          sudo ln -sf /opt/firefox/firefox /usr/bin/firefox

      - name: Install Required System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxmlsec1-dev ubuntu-restricted-extras xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Install external dependencies
        run: npm run setup-tests

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test-ci

  frontend-translations:
    name: Check Extracted Frontend Translations
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # React frontends write their messages to a file that `make extract_translations`
      # reads (e.g. src/xblock_flashcards/assets/i18n/messages.js). It must be committed.
      - name: Extract frontend translations
        run: npm run i18n_extract

      - name: Check the extracted translations are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Frontend messages changed: run 'npm run i18n_extract' and commit the result."
            exit 1
          fi
